<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Peta SPBU Pertamina Manado</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        #map {
            height: 650px;
            width: 100%;
            border-radius: 8px;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h2 {
            color: #333;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Peta Persebaran SPBU Pertamina di Manado</h2>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        // Inisialisasi Peta (Koordinat Manado)
        var map = L.map('map').setView([1.4748, 124.8421], 13);

        // Menambahkan Layer Peta OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Custom Icon untuk SPBU
        var spbuIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448650.png', // Contoh icon publik jika file lokal tidak ada
            iconSize: [40, 40],
            iconAnchor: [20, 40],
            popupAnchor: [0, -40]
        });

        // DATA STATIS (Pengganti Database PHP)
        // Anda bisa menambah atau mengubah koordinat di sini
        var dataSPBU = [
            {
                nama: "SPBU COCO 71.951.03",
                lat: 1.4855,
                lng: 124.8385
            },
            {
                nama: "SPBU Pertamina Tikala",
                lat: 1.4741,
                lng: 124.8450
            },
            {
                nama: "SPBU Pertamina Malalayang",
                lat: 1.4550,
                lng: 124.8150
            }
        ];

        // Looping untuk menampilkan marker di peta
        dataSPBU.forEach(function(spbu) {
            L.marker([spbu.lat, spbu.lng], { icon: spbuIcon })
                .addTo(map)
                .bindPopup("<b>" + spbu.nama + "</b><br>Kota Manado");
        });
    </script>

</body>

</html>
